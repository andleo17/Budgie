services:
  api:
    build:
      context: .
      dockerfile: src/apps/Budgie.Api/Dockerfile
    ports:
      - "${BUDGIE_PORT:-80}:80"
    volumes:
      # Person photos: kept out of the image layer so they survive rebuilds.
      - budgie_uploads:/app/wwwroot/uploads
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://0.0.0.0:80
      - ConnectionStrings__BudgieDb=Host=${DB_HOST:-db};Database=${POSTGRES_DB:-budgie};Username=${POSTGRES_USER:-budgie};Password=${POSTGRES_PASSWORD:?error}
      - Jwt__Secret=${JWT_SECRET:?error}
      - Jwt__Issuer=${JWT_ISSUER:-Budgie}
      - Jwt__Audience=${JWT_AUDIENCE:-Budgie}
      - Registration__Mode=${REGISTRATION_MODE:-Auto}
      # EmailImport: el worker solo se registra con EMAILIMPORT_ENABLED=true.
      # ClientId/ClientSecret salen de un OAuth client de Google Cloud Console; el redirect
      # URI a registrar es https://<dominio>/api/email-import/connections/gmail/callback
      - EmailImport__Enabled=${EMAILIMPORT_ENABLED:-false}
      - EmailImport__SyncIntervalMinutes=${EMAILIMPORT_SYNCINTERVALMINUTES:-10}
      - EmailImport__EncryptionKey=${EMAILIMPORT_ENCRYPTIONKEY:-}
      # Doble guion bajo por nivel de configuración ('__' -> ':' en IConfiguration).
      # Un ':' literal en el nombre de la variable no es POSIX-legal y confunde a
      # cualquier herramienta que lea el entorno.
      - EmailImport__Providers__gmail__ClientId=${EMAILIMPORT_PROVIDERS_GMAIL_CLIENTID:-}
      - EmailImport__Providers__gmail__ClientSecret=${EMAILIMPORT_PROVIDERS_GMAIL_CLIENTSECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-budgie}
      - POSTGRES_USER=${POSTGRES_USER:-budgie}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?error}
      - PGDATA=/var/lib/postgresql/18/docker
    volumes:
      - budgie_postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  budgie_postgres_data:
  budgie_uploads:
